
[workspace]
resolver = "3"
members = [
  "crates/sim-lib-femm-assembly",
  "crates/sim-lib-femm-codec",
  "crates/sim-lib-femm-core",
  "crates/sim-lib-femm-fixtures",
  "crates/sim-lib-femm-field",
  "crates/sim-lib-femm-flow",
  "crates/sim-lib-femm-function",
  "crates/sim-lib-femm-geometry",
  "crates/sim-lib-femm-material",
  "crates/sim-lib-femm-mesh",
  "crates/sim-lib-femm-ode",
  "crates/sim-lib-femm-physics",
  "crates/sim-lib-femm-post",
  "crates/sim-lib-femm-prelude",
  "crates/sim-lib-femm-query",
  "crates/sim-lib-femm-sensitiv",
  "crates/sim-lib-femm-solve",
  "crates/sim-lib-femm-space",
  "crates/sim-lib-femm-tape",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-femm"
homepage = "https://github.com/sim-nest/sim-femm"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
sim-lib-numbers-tensor = { git = "https://github.com/sim-nest/sim-numbers", rev = "1713431936f6c0d9517dbb9af4b4515da2bb6c2d" }
sim-lib-numbers-tensor-bcast = { git = "https://github.com/sim-nest/sim-numbers", rev = "1713431936f6c0d9517dbb9af4b4515da2bb6c2d" }
sim-lib-numbers-tensor-bit = { git = "https://github.com/sim-nest/sim-numbers", rev = "1713431936f6c0d9517dbb9af4b4515da2bb6c2d" }
sim-lib-numbers-tensor-cmplxf = { git = "https://github.com/sim-nest/sim-numbers", rev = "1713431936f6c0d9517dbb9af4b4515da2bb6c2d" }
sim-lib-numbers-tensor-f64 = { git = "https://github.com/sim-nest/sim-numbers", rev = "1713431936f6c0d9517dbb9af4b4515da2bb6c2d" }
sim-lib-numbers-tensor-i64 = { git = "https://github.com/sim-nest/sim-numbers", rev = "1713431936f6c0d9517dbb9af4b4515da2bb6c2d" }
sim-lib-numbers-tensor-linalg = { git = "https://github.com/sim-nest/sim-numbers", rev = "1713431936f6c0d9517dbb9af4b4515da2bb6c2d" }
sim-lib-numbers-tensor-rat64 = { git = "https://github.com/sim-nest/sim-numbers", rev = "1713431936f6c0d9517dbb9af4b4515da2bb6c2d" }
